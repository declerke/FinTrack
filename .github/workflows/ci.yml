name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - qa/fintrack-release-verification

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      # The app engine cannot connect here. Integration fixtures use only the test service.
      DATABASE_URL: postgresql+psycopg://ci@fintrack-app.invalid:5432/fintrack
      TEST_DATABASE_URL: postgresql+psycopg://fintrack_ci:fintrack-ci-only@127.0.0.1:5433/fintrack_test
      FINTRACK_REQUIRE_TEST_DATABASE: "1"
      JWT_SECRET_KEY: fintrack-ci-only-signing-key-for-automated-checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fintrack_ci
          POSTGRES_PASSWORD: fintrack-ci-only
          POSTGRES_DB: fintrack_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fintrack_ci -d fintrack_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.9'
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check OpenAPI export
        run: uv run --locked python export_openapi.py --check
      - name: Test against PostgreSQL
        run: uv run --locked pytest -ra
